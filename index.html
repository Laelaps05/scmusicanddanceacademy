<script>
  fetch('./content.json')
    .then(res => res.json())
    .then(data => {
      // Image handler: Automatically cleans up leading slashes and messy URLs
      if (data.hero_image) {
        let imgPath = data.hero_image.trim();
        
        // Remove leading slash if mom or Pages CMS adds one
        if (imgPath.startsWith('/')) {
          imgPath = imgPath.substring(1);
        }
        
        document.getElementById('hero_img').src = imgPath;
      }

      // Text bindings
      document.getElementById('announcement').innerText = data.announcement || '';
      document.getElementById('hero_title').innerText = data.hero_title || '';
      document.getElementById('hero_subtitle').innerText = data.hero_subtitle || '';
      document.getElementById('about_text').innerHTML = data.about_text || '';
      document.getElementById('quote').innerText = data.quote || '';
      
      // Contact link bindings
      if (data.email) {
        const emailLink = document.getElementById('email_link');
        emailLink.innerText = data.email;
        emailLink.href = 'mailto:' + data.email;
      }

      if (data.phone) {
        const phoneLink = document.getElementById('phone_link');
        phoneLink.innerText = data.phone;
        phoneLink.href = 'tel:' + data.phone.replace(/[^0-9]/g, '');
      }
    })
    .catch(err => console.error("Could not load content.json", err));
</script>
