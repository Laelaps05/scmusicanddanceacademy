media: images
content:
  - name: homepage
    label: Site Content
    type: file
    path: content.json
    fields:
      - name: announcement
        label: Top Announcement Banner
        type: string
      - name: hero_title
        label: Hero Title
        type: string
      - name: hero_subtitle
        label: Hero Subtitle
        type: string
      - name: hero_image
        label: Main Hero Photo
        type: image
      - name: about_text
        label: About Section Paragraph
        type: rich-text
      - name: quote
        label: Featured Quote
        type: string
      - name: feature_cards
        label: Class & Feature Cards (Alternating)
        type: object
        list: true
        fields:
          - name: title
            label: Card Title (e.g. Tap Dance)
            type: string
          - name: text
            label: Card Description
            type: rich-text
          - name: image
            label: Card Photo
            type: image
      - name: phone
        label: Phone Number
        type: string
      - name: email
        label: Contact Email
        type: string