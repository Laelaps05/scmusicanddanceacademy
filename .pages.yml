media: images
content:
  - name: homepage
    label: Site Content
    type: file
    path: content.json
    fields:
      - name: announcement
        label: Top Announcement Banner
        type: string
      - name: hero_title
        label: Hero Title
        type: string
      - name: hero_subtitle
        label: Hero Subtitle
        type: string
      - name: hero_image
        label: Main Hero Photo
        type: image
      - name: about_text
        label: About Section Paragraph
        type: rich-text
      - name: quote
        label: Featured Quote
        type: string
      - name: programs
        label: Dance Programs (Photos & Details)
        type: list
        fields:
          - name: title
            label: Program Name (e.g. Tap Dance)
            type: string
          - name: subtitle
            label: Age / Description Tag
            type: string
          - name: image
            label: Program Photo
            type: image
      - name: gallery
        label: Photo Gallery (Add / Change Photos)
        type: list
        fields:
          - name: image
            label: Gallery Photo
            type: image
          - name: caption
            label: Photo Caption
            type: string
      - name: phone
        label: Phone Number
        type: string
      - name: email
        label: Contact Email
        type: string