media: images
content:
  # TAB 1: HOME PAGE CONTENT
  - name: homepage
    label: "🏠 Home Page Content"
    type: file
    path: content.json
    fields:
      - name: announcement
        label: Top Announcement Banner
        type: string
        description: "Appears in the gold banner at the very top of the page."
      - name: header_logo
        label: Header Logo Image (Optional)
        type: image
        description: "Upload a PNG or WebP logo file."
      - name: header_title
        label: Header Text Title
        type: string
        description: "Text shown next to or in place of the logo. Leave blank if image only."
      - name: hero_title
        label: Hero Title
        type: string
      - name: hero_subtitle
        label: Hero Subtitle
        type: string
      - name: hero_image
        label: Main Hero Photo
        type: image
      - name: hero_button_text
        label: Hero Button Text
        type: string
      - name: hero_button_url
        label: Hero Button Link / URL
        type: string
      - name: about_title
        label: About Section Title
        type: string
        description: "The heading above the main about text (e.g. Welcome)."
      - name: about_text
        label: About Section Paragraph
        type: rich-text
      - name: quote
        label: Featured Quote
        type: string
      - name: feature_cards
        label: Class & Feature Cards (Alternating)
        type: object
        list: true
        fields:
          - name: title
            label: Card Title (e.g. Tap Dance)
            type: string
          - name: text
            label: Card Description
            type: rich-text
          - name: image
            label: Card Photo
            type: image
          - name: button_text
            label: Card Button Text (Optional)
            type: string
          - name: button_url
            label: Card Button Link / URL (Optional)
            type: string
      - name: locations
        label: Studio Locations
        type: object
        list: true
        fields:
          - name: title
            label: Location Name (e.g. Columbia Location)
            type: string
          - name: address
            label: Address / Building Info
            type: string
          - name: map_url
            label: Google Maps Link / Directions (Optional)
            type: string
      - name: phone
        label: Phone Number
        type: string
      - name: email
        label: Contact Email
        type: string

  # TAB 2: FORMS PAGE CONTENT
  - name: formspage
    label: "📄 Registration Forms & Links"
    type: file
    path: forms.json
    fields:
      - name: page_title
        label: Forms Page Title
        type: string
        description: "The header at the top of the forms page (e.g. Printable Forms & Documents)."
      - name: page_subtitle
        label: Forms Page Subtitle
        type: string
        description: "Helper text above the list of forms."
      - name: forms
        label: List of Printable Downloads & PDFs
        type: object
        list: true
        fields:
          - name: title
            label: Form Title (e.g. 2026 Registration Form)
            type: string
          - name: description
            label: Short Description
            type: string
          - name: url
            label: Form Link (Dropbox or Google Drive PDF URL)
            type: string
            description: "Paste the shareable Dropbox PDF link here."
          - name: button_text
            label: Button Label
            type: string
            description: "Default: Download PDF"